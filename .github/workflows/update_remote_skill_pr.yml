name: Update Remotion SKILL (create draft PR)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * 1' # 每周一 02:00 UTC

jobs:
  update-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official SKILL.md
        run: |
          curl -fsSL https://raw.githubusercontent.com/remotion-dev/remotion/main/packages/skills/skills/remotion/SKILL.md -o remotion_remote_SKILL.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion_remote_SKILL.md || true
          git commit -m "chore: update remotion_remote_SKILL.md from upstream" || echo "No changes to commit"

      - name: Create draft PR
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore: update remotion_remote_SKILL.md from upstream
          branch: update/remotion-skill
          title: "chore: sync remotion remote SKILL.md"
          body: |
            This PR updates `remotion_remote_SKILL.md` from the official Remotion repository.
            Please review changes before merging. The file is intended for manual review and selective merging into `SKILL.md`.
          draft: true
